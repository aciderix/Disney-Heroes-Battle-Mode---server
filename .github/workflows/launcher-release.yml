name: launcher-release

# Construit le PACKAGE LAUNCHER clé-en-main (game-free, copyright-propre) sur Linux ET Windows,
# embarque un JDK complet + un CPython relocatable (python-build-standalone) + l'APPLI FENÊTRÉE Tauri
# (exe qui ouvre une fenêtre avec les 7 écrans et démarre le daemon), et le publie en RELEASE.
# Le joueur télécharge le package de SON OS, double-clique l'exe DisneyHeroesLauncher (fenêtre) — ou lance
# run-launcher.sh/.bat (daemon HTTP seul) — sans rien installer, fournit son APK, génère/héberge, joue.
#
# Déclenche : manuellement (workflow_dispatch) ou sur tag `launcher-v*` (→ crée la Release téléchargeable).

on:
  workflow_dispatch:
  push:
    tags:
      - 'launcher-v*'

permissions:
  contents: write        # créer/attacher la Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            oskind: linux
            pyexe: runtime/python/bin/python3
          - os: windows-latest
            oskind: windows
            pyexe: runtime/python/python.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build launcher package
        shell: bash
        env:
          OSKIND: ${{ matrix.oskind }}
          OUT: ${{ github.workspace }}/build/launcher-${{ matrix.oskind }}
        run: bash tools/build_launcher.sh

      - name: Smoke — launcher runs game-free (identity + health) + python embarqué
        shell: bash
        env:
          OUT: ${{ github.workspace }}/build/launcher-${{ matrix.oskind }}
          PYEXE: ${{ matrix.pyexe }}
        run: |
          "$OUT/runtime/jdk/bin/java" -cp "$OUT/dhlauncher.jar" dhlauncher.LauncherDaemon --port 8090 --project "$OUT/tooling" &
          LP=$!
          for i in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:8090/health" >/dev/null 2>&1 && break || sleep 1
          done
          curl -fsS "http://127.0.0.1:8090/health"; echo " <- /health OK"
          curl -fsS -X POST "http://127.0.0.1:8090/identity/generate" | head -c 200; echo " <- /identity/generate OK"
          "$OUT/$PYEXE" --version   # PROUVE le python embarqué (Linux ET Windows)
          kill $LP 2>/dev/null || true

      # --- APPLI FENÊTRÉE (Tauri) : buildée puis DÉPOSÉE dans le package, à côté de dhlauncher.jar + runtime/jdk
      #     (main.rs les résout depuis le dossier de l'exe) → un seul téléchargement, double-clic = fenêtre. ---
      - name: Install Linux WebView deps (Tauri)
        if: matrix.oskind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: launcher-ui/package-lock.json

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'launcher-ui/src-tauri -> target'

      - name: Build windowed launcher (Tauri)
        working-directory: launcher-ui
        run: |
          npm ci
          npx tauri build

      - name: Place windowed exe into the package
        shell: bash
        env:
          OUT: ${{ github.workspace }}/build/launcher-${{ matrix.oskind }}
        run: |
          REL="launcher-ui/src-tauri/target/release"
          if [ "${{ matrix.oskind }}" = windows ]; then
            cp "$REL/disney-heroes-launcher.exe" "$OUT/DisneyHeroesLauncher.exe"
          else
            cp "$REL/disney-heroes-launcher" "$OUT/DisneyHeroesLauncher"
            chmod +x "$OUT/DisneyHeroesLauncher"
          fi
          ls -la "$OUT"

      - name: Archive package
        shell: bash
        run: |
          cd build
          if [ "${{ matrix.oskind }}" = windows ]; then
            7z a -tzip "dh-launcher-${{ matrix.oskind }}.zip" "launcher-${{ matrix.oskind }}" >/dev/null
          else
            tar -czf "dh-launcher-${{ matrix.oskind }}.tar.gz" "launcher-${{ matrix.oskind }}"
          fi
          ls -la

      - name: Verify EXTRACTED package (simule le poste du joueur — attrape JDK/py manquants)
        shell: bash
        env:
          PYEXE: ${{ matrix.pyexe }}
        run: |
          cd build && rm -rf _verify && mkdir _verify && cd _verify
          if [ "${{ matrix.oskind }}" = windows ]; then
            7z x "../dh-launcher-${{ matrix.oskind }}.zip" >/dev/null
          else
            tar -xzf "../dh-launcher-${{ matrix.oskind }}.tar.gz"
          fi
          P="launcher-${{ matrix.oskind }}"
          # java DOIT être un vrai binaire dans le package extrait (pas un lien mort) :
          "$P/runtime/jdk/bin/java" -version
          "$P/runtime/jdk/bin/javac" -version    # outils de build présents (génération de bundles)
          "$P/$PYEXE" --version
          # l'exe fenêtré DOIT être dans le package extrait (à côté du jar + runtime) :
          if [ "${{ matrix.oskind }}" = windows ]; then test -f "$P/DisneyHeroesLauncher.exe"; else test -f "$P/DisneyHeroesLauncher"; fi
          echo "OK — package extrait autonome (JDK + Python + exe fenêtré réels)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dh-launcher-${{ matrix.oskind }}
          path: build/dh-launcher-${{ matrix.oskind }}.*
          retention-days: 7

      - name: Attach to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/launcher-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "Launcher clé-en-main (JDK + Python embarqués + appli FENÊTRÉE). Package par OS : double-cliquer DisneyHeroesLauncher(.exe) pour la fenêtre, ou run-launcher.sh/.bat pour le daemon seul. Fournir son APK." || true
          gh release upload "${GITHUB_REF_NAME}" build/dh-launcher-${{ matrix.oskind }}.* --clobber
