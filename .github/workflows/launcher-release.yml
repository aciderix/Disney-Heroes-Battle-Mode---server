name: launcher-release

# Construit le PACKAGE LAUNCHER clé-en-main (game-free, copyright-propre) sur Linux ET Windows,
# embarque un JDK complet + un CPython relocatable (python-build-standalone) + l'APPLI FENÊTRÉE Tauri
# (exe qui ouvre une fenêtre avec les 7 écrans et démarre le daemon), et le publie en RELEASE.
# Le joueur télécharge le package de SON OS, double-clique l'exe DisneyHeroesLauncher (fenêtre) — ou lance
# run-launcher.sh/.bat (daemon HTTP seul) — sans rien installer, fournit son APK, génère/héberge, joue.
#
# Déclenche : manuellement (workflow_dispatch) ou sur tag `launcher-v*` (→ crée la Release téléchargeable).

on:
  workflow_dispatch:
  push:
    tags:
      - 'launcher-v*'

permissions:
  contents: write        # créer/attacher la Release

jobs:
  # PERF : pré-compile le backend spine jni natif (libhostspine64.so + .dll) UNE fois, GAME-FREE (en-têtes JNI
  # committés dans native/jni-headers/ → pas besoin de game.jar) sur un runner Linux (gcc pour le .so + MinGW pour
  # cross-compiler le .dll Windows). Les deux libs sont embarquées dans les packages par le job build → le joueur a
  # le backend rapide (~50×) SANS installer de compilateur C. Rien de copyright ici (runtime spine-c public compilé,
  # glue JNI maison, en-têtes = prototypes C).
  hostspine:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install toolchains (gcc + MinGW-w64)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-mingw-w64-x86-64 git
      - name: Build hostspine (.so Linux + .dll Windows) game-free
        run: |
          cd native
          bash build.sh
          bash build-hostspine.sh
          bash build-hostspine-win.sh
          ls -la build/libhostspine64.so build/libhostspine64.dll
          file build/libhostspine64.dll
      - name: Upload hostspine natives
        uses: actions/upload-artifact@v4
        with:
          name: hostspine-natives
          path: |
            native/build/libhostspine64.so
            native/build/libhostspine64.dll
          retention-days: 7

  build:
    needs: hostspine
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 (GLIBC 2.35) et non ubuntu-latest/24.04 (GLIBC 2.39) : un binaire lié à 2.39 REFUSE de
          # démarrer sur Debian 12 (2.36) / Ubuntu 22.04 (2.35) etc. (bug #2). Builder sur la plus ANCIENNE GLIBC
          # raisonnable maximise la compat descendante ; l'AppImage (déjà produit par Tauri) embarque webkit2gtk.
          - os: ubuntu-22.04
            oskind: linux
            pyexe: runtime/python/bin/python3
            hostspinelib: libhostspine64.so
          - os: windows-latest
            oskind: windows
            pyexe: runtime/python/python.exe
            hostspinelib: libhostspine64.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download prebuilt hostspine natives
        uses: actions/download-artifact@v4
        with:
          name: hostspine-natives
          path: hostspine-prebuilt

      - name: Build launcher package
        shell: bash
        env:
          OSKIND: ${{ matrix.oskind }}
          OUT: ${{ github.workspace }}/build/launcher-${{ matrix.oskind }}
          # ANNUAIRE (brique 3) — URL + clé anon PUBLIQUES de l'annuaire communautaire, embarquées dans directory.env.
          # Rien de secret ici (jamais le service_role). Absents → l'annuaire n'est simplement pas préconfiguré.
          DH_DIRECTORY_URL: ${{ secrets.SUPABASE_URL }}
          DH_DIRECTORY_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Backend spine jni pré-compilé pour CET OS → embarqué dans tooling/native/build/ (perf sans compilateur joueur).
          DH_HOSTSPINE_LIB: ${{ github.workspace }}/hostspine-prebuilt/${{ matrix.hostspinelib }}
        run: bash tools/build_launcher.sh

      - name: Smoke — launcher runs game-free (identity + health) + python embarqué
        shell: bash
        env:
          OUT: ${{ github.workspace }}/build/launcher-${{ matrix.oskind }}
          PYEXE: ${{ matrix.pyexe }}
        run: |
          "$OUT/runtime/jdk/bin/java" -cp "$OUT/dhlauncher.jar" dhlauncher.LauncherDaemon --port 8090 --project "$OUT/tooling" &
          LP=$!
          for i in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:8090/health" >/dev/null 2>&1 && break || sleep 1
          done
          curl -fsS "http://127.0.0.1:8090/health"; echo " <- /health OK"
          curl -fsS -X POST "http://127.0.0.1:8090/identity/generate" | head -c 200; echo " <- /identity/generate OK"
          "$OUT/$PYEXE" --version   # PROUVE le python embarqué (Linux ET Windows)
          kill $LP 2>/dev/null || true

      # --- APPLI FENÊTRÉE (Tauri) : buildée puis DÉPOSÉE dans le package, à côté de dhlauncher.jar + runtime/jdk
      #     (main.rs les résout depuis le dossier de l'exe) → un seul téléchargement, double-clic = fenêtre. ---
      - name: Install Linux WebView deps (Tauri)
        if: matrix.oskind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: launcher-ui/package-lock.json

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'launcher-ui/src-tauri -> target'
          # La clé par défaut ne distingue que runner.os (« Linux » pour 24.04 ET 22.04) → en passant
          # d'ubuntu-latest à ubuntu-22.04, le cache 24.04 empoisonnait le build (error[E0463] can't find crate
          # for `tauri`). On inclut la VERSION exacte de l'OS dans la clé → cache isolé par version.
          key: ${{ matrix.os }}

      - name: Build windowed launcher (Tauri)
        working-directory: launcher-ui
        run: |
          npm ci
          npx tauri build

      - name: Place windowed exe into the package
        shell: bash
        env:
          OUT: ${{ github.workspace }}/build/launcher-${{ matrix.oskind }}
        run: |
          REL="launcher-ui/src-tauri/target/release"
          if [ "${{ matrix.oskind }}" = windows ]; then
            cp "$REL/disney-heroes-launcher.exe" "$OUT/DisneyHeroesLauncher.exe"
          else
            cp "$REL/disney-heroes-launcher" "$OUT/DisneyHeroesLauncher"
            chmod +x "$OUT/DisneyHeroesLauncher"
          fi
          ls -la "$OUT"

      - name: Archive package
        shell: bash
        run: |
          cd build
          if [ "${{ matrix.oskind }}" = windows ]; then
            7z a -tzip "dh-launcher-${{ matrix.oskind }}.zip" "launcher-${{ matrix.oskind }}" >/dev/null
          else
            tar -czf "dh-launcher-${{ matrix.oskind }}.tar.gz" "launcher-${{ matrix.oskind }}"
          fi
          ls -la

      - name: Verify EXTRACTED package (simule le poste du joueur — attrape JDK/py manquants)
        shell: bash
        env:
          PYEXE: ${{ matrix.pyexe }}
        run: |
          cd build && rm -rf _verify && mkdir _verify && cd _verify
          if [ "${{ matrix.oskind }}" = windows ]; then
            7z x "../dh-launcher-${{ matrix.oskind }}.zip" >/dev/null
          else
            tar -xzf "../dh-launcher-${{ matrix.oskind }}.tar.gz"
          fi
          P="launcher-${{ matrix.oskind }}"
          # java DOIT être un vrai binaire dans le package extrait (pas un lien mort) :
          "$P/runtime/jdk/bin/java" -version
          "$P/runtime/jdk/bin/javac" -version    # outils de build présents (génération de bundles)
          "$P/$PYEXE" --version
          # l'exe fenêtré DOIT être dans le package extrait (à côté du jar + runtime) :
          if [ "${{ matrix.oskind }}" = windows ]; then test -f "$P/DisneyHeroesLauncher.exe"; else test -f "$P/DisneyHeroesLauncher"; fi
          echo "OK — package extrait autonome (JDK + Python + exe fenêtré réels)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dh-launcher-${{ matrix.oskind }}
          path: build/dh-launcher-${{ matrix.oskind }}.*
          retention-days: 7

      - name: Attach to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/launcher-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "Launcher clé-en-main (JDK + Python embarqués + appli FENÊTRÉE). Package par OS : double-cliquer DisneyHeroesLauncher(.exe) pour la fenêtre, ou run-launcher.sh/.bat pour le daemon seul. Fournir son APK." || true
          gh release upload "${GITHUB_REF_NAME}" build/dh-launcher-${{ matrix.oskind }}.* --clobber
