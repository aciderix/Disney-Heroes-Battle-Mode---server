[package]
name = "disney-heroes-launcher"
version = "0.1.0"
description = "Launcher Disney Heroes (port privé) — shell natif. Ne contient aucun code du jeu."
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
